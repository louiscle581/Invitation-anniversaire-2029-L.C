<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>La Maladrie - Vous avez reçu une invitation</title>
<style>
  :root{
    --blue: #58758a;
    --blue-dark: #3f5666;
    --blue-flap: #4a6478;
    --cream: #f4efdf;
    --shadow: rgba(15,25,32,0.4);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1c2b33;
  }

  body {
    background: radial-gradient(ellipse at center, #2c4453 0%, #16232b 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.06) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.15) 0, transparent 45%);
    pointer-events: none;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1800px;
  }

  .hint {
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    color: #cfe0e8;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.7;
    animation: pulseHint 2.2s ease-in-out infinite;
    text-align: center;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .hint.hidden { opacity: 0 !important; }

  @keyframes pulseHint {
    0%, 100% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
    50% { opacity: 0.85; transform: translateX(-50%) translateY(-4px); }
  }

  /* ================= ENVELOPE ================= */
  .envelope-wrap {
    position: relative;
    width: min(78vw, 460px);
    aspect-ratio: 460 / 300;
    cursor: pointer;
    transform-style: preserve-3d;
    animation: idleBounce 3.4s ease-in-out infinite;
    filter: drop-shadow(0 18px 30px var(--shadow));
    transition: transform 0.4s ease;
  }

  .envelope-wrap.opening,
  .envelope-wrap.opened {
    animation: none;
  }

  @keyframes idleBounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(-0.6deg); }
  }

  .envelope-body {
    position: absolute;
    inset: 0;
    background: linear-gradient(155deg, var(--blue) 0%, var(--blue-dark) 100%);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  }

  .envelope-body::before,
  .envelope-body::after {
    content: "";
    position: absolute;
    bottom: -2%;
    width: 52%;
    height: 78%;
    background: linear-gradient(160deg, rgba(255,255,255,0.10), rgba(0,0,0,0.22));
  }

  .envelope-body::before {
    left: -2%;
    clip-path: polygon(0% 100%, 100% 100%, 0% 0%);
  }

  .envelope-body::after {
    right: -2%;
    clip-path: polygon(0% 100%, 100% 100%, 100% 0%);
  }

  .pocket-front {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 62%;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.18));
    clip-path: polygon(0% 100%, 100% 100%, 50% 0%);
    z-index: 3;
  }

  .flap {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 58%;
    background: linear-gradient(200deg, var(--blue-flap) 0%, var(--blue-dark) 100%);
    clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform 0.9s cubic-bezier(.6,-0.1,.25,1);
    z-index: 5;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }

  .envelope-wrap.opening .flap,
  .envelope-wrap.opened .flap {
    transform: rotateX(-172deg);
  }

  /* ================= WAX SEAL ================= */
  .seal {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 108px;
    height: 108px;
    transform: translate(-50%, -50%) rotate(-6deg);
    border-radius: 42% 58% 63% 37% / 45% 41% 59% 55%;
    z-index: 8;
    background:
      radial-gradient(circle at 33% 28%, #7a99ab 0%, #5f7d8f 42%, #46606f 75%, #34495a 100%);
    box-shadow:
      0 8px 16px rgba(0,0,0,0.5),
      inset 0 3px 5px rgba(255,255,255,0.35),
      inset 0 -8px 12px rgba(0,0,0,0.45),
      inset 3px 2px 3px rgba(255,255,255,0.18);
    transition: transform 0.55s cubic-bezier(.5,-0.4,.4,1.4), opacity 0.45s ease;
  }

  .seal-inner {
    position: absolute;
    inset: 10%;
    border-radius: 45% 55% 60% 40% / 48% 44% 56% 52%;
    overflow: hidden;
    box-shadow:
      inset 0 2px 3px rgba(0,0,0,0.5),
      inset 0 -1px 2px rgba(255,255,255,0.2);
    background: #f4efdf;
  }

  .seal-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(1.05) contrast(1.03);
  }

  .seal-shine {
    position: absolute;
    top: 12%;
    left: 18%;
    width: 34%;
    height: 22%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 70%);
    border-radius: 50%;
    transform: rotate(-20deg);
    pointer-events: none;
  }

  .envelope-wrap.opening .seal,
  .envelope-wrap.opened .seal {
    transform: translate(-50%, -50%) rotate(50deg) scale(0.2);
    opacity: 0;
  }

  /* ================= FULLSCREEN TRANSITION ================= */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 16, 20, 0);
    z-index: 20;
    pointer-events: none;
    transition: background 0.6s ease;
  }

  .backdrop.show {
    background: rgba(10, 16, 20, 0.94);
  }

  .fullscreen-card {
    position: fixed;
    display: none;
    z-index: 21;
    background: var(--cream);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  .fullscreen-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .loading-msg {
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    color: #cfe0e8;
    font-size: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: 22;
    text-align: center;
    pointer-events: none;
  }

  .loading-msg.show {
    opacity: 0.85;
  }

  /* ================= PHOTO BACKGROUND ================= */
  .photo-scatter {
    position: fixed;
    inset: -8vh -8vw;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background: #17252d;
  }

  .photo-scatter::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(8, 14, 18, 0.08);
    pointer-events: none;
  }

  .scatter-photo {
    position: absolute;
    width: clamp(260px, 34vw, 620px);
    height: clamp(190px, 32vh, 480px);
    object-fit: cover;
    border: 6px solid #f4efdf;
    box-shadow: 0 14px 34px rgba(0,0,0,0.35);
    opacity: 1;
    transform-origin: center;
    animation: photoThrow 1.15s cubic-bezier(.18,.82,.22,1) forwards;
  }

  @keyframes photoThrow {
    0% {
      opacity: 0;
      transform: translate(var(--sx), var(--sy)) rotate(var(--start-rot)) scale(.72);
    }
    100% {
      opacity: 1;
      transform: translate(0,0) rotate(var(--rot)) scale(1);
    }
  }

  .envelope-wrap, .hint { z-index: 10; }

  @media (prefers-reduced-motion: reduce) {
    .scatter-photo { animation: none; opacity: 1; transform: rotate(var(--rot)); }
  }

</style>
</head>

<div class="backdrop" id="backdrop"></div>
<div class="fullscreen-card" id="fullscreenCard"></div>
<div class="loading-msg" id="loadingMsg">Ouverture de l'invitation...</div>

<script>
  const envelope = document.getElementById('envelope');
  const hint = document.getElementById('hint');
  const backdrop = document.getElementById('backdrop');
  const fullscreenCard = document.getElementById('fullscreenCard');
  const loadingMsg = document.getElementById('loadingMsg');
  const seal = document.getElementById('seal');

  /* ================= CONTINUOUS RANDOM PHOTO BACKGROUND ================= */
  const photoScatter = document.getElementById('photoScatter');
/* ================= CONTINUOUS RANDOM PHOTO BACKGROUND ================= */
/* ================= Mes photos: ================= */
  /*PHOTO_SOURCES_START*/
  let PHOTO_SOURCES = [
    'photo1.jpg',
    'photo2.jpg',
	'photo3.jpg',
	'photo4.jpg',
	'photo5.jpg',
	'photo6.jpg',
	'photo7.jpg',
   
  ];
  /*PHOTO_SOURCES_END*/

  const FALLBACK_PHOTO = seal.querySelector('img').src;
  const MAX_PHOTOS = 18;
  const PHOTO_INTERVAL_MS = 900; // délai entre chaque nouvelle photo (une par une)

  let scatterTimer = null;
  let burstTimeouts = [];
  let zCounter = 1; // toujours croissant : la dernière photo posée est toujours au-dessus

  function random(min, max) {
    return Math.random() * (max - min) + min;
  }

  // Pioche sans répétition : on mélange toutes les photos, on les distribue
  // une par une, puis on remélange — ainsi deux photos qui se suivent ne
  // sont (presque) jamais identiques, même avec peu de photos différentes.
  let deck = [];
  let lastPhoto = null;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function nextPhotoSrc() {
    if (deck.length === 0) {
      deck = shuffle(PHOTO_SOURCES);
      if (deck.length > 1 && deck[deck.length - 1] === lastPhoto) {
        [deck[deck.length - 1], deck[0]] = [deck[0], deck[deck.length - 1]];
      }
    }
    const src = deck.pop();
    lastPhoto = src;
    return src;
  }

  function createPhoto() {
    const img = document.createElement('img');
    img.className = 'scatter-photo';
    img.src = nextPhotoSrc();
    img.alt = '';
    img.draggable = false;

    // Les photos couvrent tout l'écran et se superposent volontairement :
    // chaque nouvelle photo reçoit un z-index plus élevé que toutes les
    // précédentes, donc elle apparaît toujours entière au-dessus des autres.
    img.style.left = random(-8, 82) + 'vw';
    img.style.top = random(-10, 78) + 'vh';
    img.style.setProperty('--rot', random(-18, 18).toFixed(2) + 'deg');
    img.style.setProperty('--start-rot', random(-45, 45).toFixed(2) + 'deg');
    img.style.setProperty('--sx', random(-220, 220).toFixed(0) + 'px');
    img.style.setProperty('--sy', random(-220, 220).toFixed(0) + 'px');
    img.style.zIndex = zCounter++;

    img.addEventListener('error', () => {
      if (img.src !== FALLBACK_PHOTO) img.src = FALLBACK_PHOTO;
    }, { once: true });

    photoScatter.appendChild(img);

    // La photo reste définitivement à l'écran : aucune photo n'est supprimée.
    // De nouvelles photos continuent donc de s'ajouter et de se superposer.
  }

  function stopScatter() {
    if (scatterTimer) clearInterval(scatterTimer);
    burstTimeouts.forEach(clearTimeout);
    burstTimeouts = [];
    scatterTimer = null;
  }

  function startScatter() {
    stopScatter();
    // Remplit immédiatement tout l'arrière-plan, une photo après l'autre.
    for (let i = 0; i < MAX_PHOTOS; i++) {
      burstTimeouts.push(setTimeout(createPhoto, i * PHOTO_INTERVAL_MS));
    }
    // Puis de nouvelles photos arrivent continuellement, toujours une par une.
    scatterTimer = setInterval(createPhoto, PHOTO_INTERVAL_MS);
  }

  startScatter();



  const DESTINATION_URL = "https://new.express.adobe.com/webpage/FxTU2XG0J5KM8";

  let opened = false;
  let animating = false;

  envelope.addEventListener('click', () => {
    if (opened || animating) return;
    animating = true;
    hint.classList.add('hidden');
    envelope.classList.add('opening');

    setTimeout(() => {
      envelope.classList.add('opened');
      launchTransition();
    }, 950);
  });

  function launchTransition() {
    const rect = seal.getBoundingClientRect();

    fullscreenCard.style.display = 'block';
    fullscreenCard.style.top = rect.top + 'px';
    fullscreenCard.style.left = rect.left + 'px';
    fullscreenCard.style.width = rect.width + 'px';
    fullscreenCard.style.height = rect.height + 'px';
    fullscreenCard.style.borderRadius = '50%';
    fullscreenCard.style.transition = 'none';

    backdrop.classList.add('show');

    void fullscreenCard.offsetWidth;

    fullscreenCard.style.transition =
      'top 0.85s cubic-bezier(.16,.9,.2,1), left 0.85s cubic-bezier(.16,.9,.2,1), width 0.85s cubic-bezier(.16,.9,.2,1), height 0.85s cubic-bezier(.16,.9,.2,1), border-radius 0.85s ease';

    requestAnimationFrame(() => {
      fullscreenCard.style.top = '0px';
      fullscreenCard.style.left = '0px';
      fullscreenCard.style.width = '100vw';
      fullscreenCard.style.height = '100vh';
      fullscreenCard.style.borderRadius = '0px';
    });

    setTimeout(() => {
      loadingMsg.classList.add('show');
      opened = true;
      animating = false;
    }, 750);

    setTimeout(() => {
      window.location.href = DESTINATION_URL;
    }, 1450);
  }
</script>
